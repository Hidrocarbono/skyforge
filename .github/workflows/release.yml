name: Release

# Workflow dedicado, disparado so por tag de versao (v*). Nao combina
# "tags" com "paths" no mesmo gatilho de push de proposito: o filtro de
# "paths" tambem seria aplicado ao push da tag, podendo pular a release se
# a tag apontar pra um commit que nao mexeu nos paths listados (ex.: tag
# criada depois, em cima de um commit ja existente). Reconstroi do zero a
# partir do commit marcado pela tag, igual ao build-skyforge-windows.yml,
# e publica o resultado como asset de uma GitHub Release de verdade (nao
# artefato de Actions, que expira).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create/publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write  # necessario pra criar a Release e anexar o .exe

jobs:
  build-cmft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar toolchain mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Aplicar patch de compatibilidade MinGW
        run: git -C external/cmft apply ../../patches/cmft-fix-mingw-compiler-detection.patch

      - name: Compilar cmft.exe
        working-directory: external/cmft
        run: |
          mkdir -p /tmp/build
          x86_64-w64-mingw32-g++ -std=c++11 -msse2 -fno-rtti -fno-exceptions -O2 \
            -D__STDC_LIMIT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_CONSTANT_MACROS \
            -Idependency -Isrc/cmft -Isrc -Iinclude \
            src/cmft/allocator.cpp \
            src/cmft/cubemapfilter.cpp \
            src/cmft/clcontext.cpp \
            src/cmft/image.cpp \
            src/cmft/common/stb_image.cpp \
            src/cmft/common/print.cpp \
            src/main.cpp \
            -o /tmp/build/cmft.exe \
            -static -lgdi32 -lopengl32

      - uses: actions/upload-artifact@v4
        with:
          name: cmft-exe-for-release
          path: /tmp/build/cmft.exe
          retention-days: 1

  build-and-release:
    needs: build-cmft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cmft-exe-for-release
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (incluindo PyInstaller)
        run: pip install -r requirements-build.txt

      - name: Empacotar com PyInstaller
        run: pyinstaller --noconfirm build_windows.spec

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/SkyForge.exe
          body_path: .github/release-notes/${{ github.event.inputs.tag || github.ref_name }}.md
          generate_release_notes: true
          append_body: true
